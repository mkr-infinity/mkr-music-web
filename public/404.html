<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost in the Silence — 404 | MKR Music</title>
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #060709;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        background: #0f1117;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }
      .wave {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        height: 48px;
        margin-bottom: 24px;
      }
      .bar {
        width: 4px;
        background: #f59e0b;
        border-radius: 2px;
        opacity: 0.7;
      }
      .bar:nth-child(1) { height: 16px; }
      .bar:nth-child(2) { height: 28px; }
      .bar:nth-child(3) { height: 42px; background: #ef4444; }
      .bar:nth-child(4) { height: 12px; }
      .bar:nth-child(5) { height: 32px; }
      .code {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #f59e0b;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
        letter-spacing: -0.02em;
      }
      p {
        color: #9ca3af;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f4f4f6;
        color: #060709;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        transition: transform 0.2s, background 0.2s;
      }
      a:hover {
        background: #ffffff;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wave">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="code">Error 404</div>
      <h1>Lost in the Silence</h1>
      <p>The frequency you are searching for does not exist or has drifted away into the void.</p>
      <a href="./">Return to Sanctuary</a>
    </div>
  </body>
</html>
